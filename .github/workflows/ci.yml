name: ci

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same ref makes an older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Hosted runners do not match the verified environments in docs/environment/,
# so CI proves that main builds and passes its tests, nothing more. Metal stays
# off and no benchmark numbers are taken here.
jobs:
  build-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: brew install ninja
      - name: Toolchain versions
        run: |
          sw_vers
          xcodebuild -version
          c++ --version
          cmake --version
      - name: Configure
        run: cmake --preset macos-release -DMCX_ENABLE_METAL=OFF -DMCX_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build --preset macos-release
      - name: Test
        run: ctest --preset macos-release

  sanitizers:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: brew install ninja
      - name: Configure
        run: cmake --preset macos-asan -DMCX_ENABLE_METAL=OFF -DMCX_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build --preset macos-asan
      - name: Test
        run: ctest --preset macos-asan
